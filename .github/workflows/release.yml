name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build installer
        run: npm run build -- --publish never

      - name: SHA-256 checksums
        shell: pwsh
        working-directory: release
        run: |
          Get-ChildItem -Filter "Rondo-Setup-*.exe" |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Rondo-Setup-*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Rondo-Setup-*.exe
            release/Rondo-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
